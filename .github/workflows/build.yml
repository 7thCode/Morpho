name: Build

on:
  # app-v* (not bare v*): bare vX.Y.Z tags are reserved for the Go library's
  # own module semver (required by `go get`/pkg.go.dev), separate from this
  # desktop app's release cadence.
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Existing release tag to upload built assets to (optional; leave empty to just upload workflow artifacts)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: 7thCode/actions-templates/.github/workflows/wails-multiplatform-release.yml@main
    with:
      wails_dir: cmd/desktop
      app_name: Morpho
      wails_cli_version: v2.12.0
      upload_to_release_tag: ${{ inputs.upload_to_release }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
