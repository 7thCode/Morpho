name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'cmd/wasm/**'
      - 'morpho.go'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather
# than cancel it, so a deploy is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build WASM playground engine
        run: GOOS=js GOARCH=wasm go build -o docs/morpho.wasm ./cmd/wasm

      - name: Copy matching wasm_exec.js
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
