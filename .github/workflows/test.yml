name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The browser playground builds cmd/wasm for js/wasm in pages.yml, which
      # only runs on main; catch breakage in pull requests instead.
      - name: Build and vet WebAssembly target
        run: |
          GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
          GOOS=js GOARCH=wasm go vet ./cmd/wasm
